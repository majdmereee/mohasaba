version: 2.0.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # تحديث مكتبات قواعد البيانات وإضافة مكتبة الويندوز الضرورية
  sqflite_common_ffi: ^2.3.4
